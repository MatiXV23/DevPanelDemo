<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="DevOps Panel — tu centro de operaciones local">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131714"/>
      <stop offset="55%" stop-color="#101212"/>
      <stop offset="100%" stop-color="#172014"/>
    </linearGradient>
    <linearGradient id="linea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b9ef82" stop-opacity="0"/>
      <stop offset="50%" stop-color="#b9ef82" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#b9ef82" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3a22"/>
      <stop offset="100%" stop-color="#1d2619"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#fondo)"/>
  <rect x="0" y="0" width="1200" height="2" fill="url(#linea)"/>

  <!-- Marca -->
  <g transform="translate(96 92)">
    <rect width="58" height="58" rx="14" fill="url(#brillo)" stroke="#637d50" stroke-width="1.5"/>
    <path d="m17 19 12 12-12 12m19 0h13" fill="none" stroke="#b9ef82" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="172" y="120" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif"
        font-size="40" font-weight="700" letter-spacing="-1.4" fill="#e9eeeb">DevOps Panel</text>
  <text x="172" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="14" letter-spacing="2.6" fill="#8fa588">DEPLOYS · VERSIONES · BACKUPS · LOGS · CONSOLA</text>

  <text x="96" y="222" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif"
        font-size="29" font-weight="500" fill="#c9d6ca">Tus scripts de siempre, con un panel adelante.</text>
  <text x="96" y="262" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif"
        font-size="17" fill="#8d9a8f">Corre en tu equipo. Tus claves no salen de ahí.</text>

  <!-- Ventana decorativa -->
  <g transform="translate(792 64)" opacity=".96">
    <rect width="328" height="192" rx="12" fill="#161a17" stroke="#2b332c"/>
    <rect x="0" y="0" width="328" height="34" rx="12" fill="#1b211c"/>
    <rect x="0" y="22" width="328" height="12" fill="#1b211c"/>
    <circle cx="20" cy="17" r="4.5" fill="#f18d87"/>
    <circle cx="37" cy="17" r="4.5" fill="#ddb878"/>
    <circle cx="54" cy="17" r="4.5" fill="#9aca9f"/>
    <text x="78" y="21" font-family="ui-monospace,monospace" font-size="10.5" fill="#6d7d6f">deploy a producción</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">
      <text x="20" y="62" fill="#8fa588">→ Construyendo la aplicación</text>
      <text x="20" y="84" fill="#5d6b5f">  ✓ 1.284 módulos transformados</text>
      <text x="20" y="106" fill="#8fa588">→ Sincronizando con el servidor</text>
      <text x="20" y="128" fill="#5d6b5f">  187 archivos · 3,2 MB</text>
      <text x="20" y="150" fill="#8fa588">→ Reiniciando los servicios</text>
      <text x="20" y="172" fill="#b9ef82">✓ v3.2.0 publicada</text>
    </g>
  </g>
</svg>
